name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON and YAML manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/miningdataapi/.claude-plugin/plugin.json plugins/miningdataapi/.mcp.json plugins/miningdataapi/plugin.json plugins/miningdataapi/mcp.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          pip3 install --quiet pyyaml
          python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" plugins/miningdataapi/skills/mining-data/agents/openai.yaml

      - name: Enforce the plugin's security posture
        # The plugin must stay markdown + manifests only: no hooks, agents,
        # scripts or credentials, and the MCP server must be the https
        # production endpoint with no headers.
        run: |
          set -eu
          cd plugins/miningdataapi
          for forbidden in hooks agents scripts bin; do
            if [ -e "$forbidden" ]; then echo "::error::$forbidden/ is not allowed in this plugin"; exit 1; fi
          done
          if find . -type f ! -name '*.md' ! -name '*.json' ! -name '*.yaml' ! -path './assets/*' | grep -q .; then
            echo "::error::only .md, .json and .yaml files are allowed outside assets/"; find . -type f ! -name '*.md' ! -name '*.json' ! -name '*.yaml' ! -path './assets/*'; exit 1
          fi
          if find assets -type f ! -name '*.svg' ! -name '*.png' | grep -q .; then
            echo "::error::assets/ may only hold .svg and .png icons"; find assets -type f ! -name '*.svg' ! -name '*.png'; exit 1
          fi
          if grep -rIlE '<script|onload=|javascript:' assets; then
            echo "::error::scripts are not allowed inside icon files"; exit 1
          fi
          python3 - <<'PY'
          import json, os, re, yaml
          URL = "https://api.miningdataapi.com/mcp"
          # Claude Code layout
          cfg = json.load(open(".mcp.json"))
          servers = cfg.get("mcpServers", {})
          assert list(servers) == ["miningdataapi"], "exactly one server named miningdataapi"
          assert servers["miningdataapi"] == {"type": "http", "url": URL}, "server must be the https endpoint with no headers or env"
          manifest = json.load(open(".claude-plugin/plugin.json"))
          for key in ("hooks", "agents", "mcpServers", "lspServers", "userConfig"):
              assert key not in manifest, f"{key} must not be declared in .claude-plugin/plugin.json"
          # Portable (OpenAI) layout
          portable = json.load(open("mcp.json"))
          pservers = portable.get("mcpServers", {})
          assert list(pservers) == ["miningdataapi"], "portable mcp.json must declare exactly miningdataapi"
          pserver = pservers["miningdataapi"]
          assert pserver["type"] == "streamable-http" and pserver["url"] == URL, "portable server must be the https production endpoint"
          assert "headers" not in pserver, "portable server must not declare headers"
          pauth = pserver.get("extensions", {}).get("com.openai", {}).get("auth", {})
          assert pauth.get("type") == "oauth" and pauth.get("client", {}).get("mode") == "dcr", "portable server must declare OAuth with dynamic client registration"
          assert "clientSecret" not in json.dumps(pserver), "no client secret in the package"
          root = json.load(open("plugin.json"))
          assert root["name"] == "miningdataapi", "portable plugin name is miningdataapi (listed as MiningDataAPI)"
          ext = root.get("extensions", {}).get("com.openai", {})
          assert "hooks" not in ext and "apps" not in ext, "no hooks or app mappings in the public package"
          assert root["version"] == manifest["version"], "plugin.json and .claude-plugin/plugin.json versions must match"
          iface = ext["interface"]
          assert iface["displayName"] == "MiningDataAPI", "display name is MiningDataAPI"
          assert len(iface["displayName"]) <= 30 and len(iface["shortDescription"]) <= 30, "displayName and shortDescription are capped at 30 characters"
          assert len(iface["longDescription"]) <= 4000 and len(iface["developerName"]) <= 80
          for url_key in ("websiteURL", "supportURL", "privacyPolicyURL", "termsOfServiceURL"):
              assert iface[url_key].startswith("https://miningdataapi.com"), f"{url_key} must point at miningdataapi.com"
          for icon in ("logo", "logoDark", "composerIcon", "composerIconDark"):
              path = iface[icon]
              assert path.startswith("./assets/") and os.path.isfile(path), f"{icon} must be a ./assets/ file that exists"
          prompts = iface["defaultPrompt"]
          assert 1 <= len(prompts) <= 3 and len(set(prompts)) == len(prompts) and all(len(p) <= 128 for p in prompts), "up to three unique default prompts of 128 chars"
          for colour in ("brandColor", "brandColorDark"):
              assert re.fullmatch(r"#[0-9A-Fa-f]{6}", iface[colour]), f"{colour} must be #RRGGBB"
          review = ext["review"]
          pos, neg = review["test_cases"]["positive"], review["test_cases"]["negative"]
          assert len(pos) == 5 and len(neg) == 3, "exactly five positive and three negative review test cases"
          for case in pos:
              assert {"description", "prompt", "tools_triggered", "expected_behavior"} <= set(case), "positive case fields"
          for case in neg:
              assert {"description", "prompt"} <= set(case), "negative case fields"
          assert review.get("commerce") is False, "the plugin sells nothing"
          for forbidden in ("test_credentials", "reviewer_instructions"):
              assert forbidden not in json.dumps(ext), f"{forbidden} belongs in the portal form, not the package"
          dep = yaml.safe_load(open("skills/mining-data/agents/openai.yaml"))
          for tool in dep.get("dependencies", {}).get("tools", []):
              assert tool.get("url") == URL, "skill dependencies may only reference the production endpoint"
          print("posture ok")
          PY
          # Real-shaped secrets only; the docs legitimately show placeholders like "os_live_…".
          if grep -rIlE --include='*.md' --include='*.json' \
               -e 'os_(live|test)_[0-9a-f]{8}_[0-9a-f]{48}' \
               -e 'sb_(secret|publishable)_[A-Za-z0-9_-]{20,}' \
               -e 'eyJhbGci[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' . ; then
            echo "::error::credential-looking string found"; exit 1
          fi
          if grep -rIn --include='*.md' -E '^!' commands skills; then
            echo "::error::shell preprocessing lines are not allowed"; exit 1
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/miningdataapi --strict

      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import json; print(json.load(open('plugins/miningdataapi/plugin.json'))['version'])")
          test "$TAG" = "$VERSION" || { echo "::error::tag v$TAG does not match plugin version $VERSION"; exit 1; }
