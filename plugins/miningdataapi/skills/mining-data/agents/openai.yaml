# OpenAI plugin metadata for this skill (ChatGPT and Codex). Claude Code ignores this file.
interface:
  display_name: "Mining Data API"
  short_description: "Query mining data from filings"
  default_prompt: "Show me ABRA.TO's latest drill results with holes, intervals and grades."

dependencies:
  tools:
    - type: "mcp"
      value: "miningdataapi"
      description: "Mining Data API: read-only search, records, dossiers and usage over the drill results and financial statements of listed mining companies (financings, projects and technical reports in early access, on request). Requires sign-in with a Mining Data API account."
      transport: "streamable_http"
      url: "https://api.miningdataapi.com/mcp"
